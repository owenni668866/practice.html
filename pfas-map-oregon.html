<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive map of known PFAS contamination sites in Oregon.">
  <title>PFAS Sites | Oregon</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css">
  <style>
    :root { --ink:#17212b; --panel:#fff; --muted:#64748b; --accent:#d44232; }
    * { box-sizing:border-box; } body { margin:0; overflow:hidden; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); }
    #map { position:fixed; inset:0; background:#e9ecef; }
    .panel { position:fixed; top:20px; left:20px; z-index:2; width:min(380px,calc(100vw - 40px)); padding:20px; background:rgba(255,255,255,.96); border-radius:14px; box-shadow:0 12px 38px rgba(15,23,42,.2); }
    .eyebrow { margin:0 0 6px; color:var(--accent); font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:0; font-size:25px; letter-spacing:-.035em; }.panel p { margin:8px 0 15px; color:var(--muted); font-size:13px; line-height:1.45; }
    #search { width:100%; padding:11px 12px; color:var(--ink); border:1px solid #cbd5e1; border-radius:8px; font:inherit; outline:none; } #search:focus { border-color:#64748b; box-shadow:0 0 0 3px rgba(100,116,139,.16); }
    .meta { display:flex; justify-content:space-between; gap:12px; margin-top:13px; color:var(--muted); font-size:11px; }.legend { display:flex; align-items:center; gap:7px; margin-top:10px; color:var(--muted); font-size:11px; }.dot { width:10px; height:10px; border-radius:50%; background:var(--accent); border:1px solid #fff; }
    .maplibregl-popup-content { max-width:315px; padding:15px; font:13px/1.45 Inter,ui-sans-serif,system-ui,sans-serif; box-shadow:0 8px 26px rgba(15,23,42,.25); }.maplibregl-popup-content h2 { margin:0 22px 7px 0; font-size:16px; line-height:1.2; }.maplibregl-popup-content p { margin:5px 0; }.maplibregl-popup-content a { color:#9d251d; font-weight:700; }
    .loading { position:fixed; right:20px; bottom:28px; z-index:2; padding:8px 11px; border-radius:6px; color:#475569; background:rgba(255,255,255,.9); font-size:12px; box-shadow:0 4px 18px rgba(15,23,42,.14); }
    @media(max-width:550px){.panel{top:10px;left:10px;width:calc(100vw - 20px);padding:15px}.panel p{margin-bottom:10px}.meta{display:block}.meta span{display:block;margin-top:4px}}
  </style>
</head>
<body>
  <main id="map" aria-label="Map of known PFAS contamination sites in Oregon"></main>
  <aside class="panel">
    <p class="eyebrow">PFAS site explorer</p><h1>Oregon PFAS sites</h1>
    <p>Known PFAS contamination sites in Oregon. Click a marker for measured PFAS information, site category, and available source links.</p>
    <label for="search" class="eyebrow" style="display:block;color:#64748b;margin-bottom:5px">Find a site or category</label><input id="search" type="search" placeholder="e.g. airport or Portland" autocomplete="off">
    <div class="meta"><span id="count">Loading locations&hellip;</span><span>Data: PFAS Project Lab</span></div><div class="legend"><i class="dot"></i> Known contamination site</div>
  </aside><div class="loading" id="loading">Loading GeoJSON&hellip;</div>
  <script src="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js"></script>
  <script>
    const map = new maplibregl.Map({container:'map',style:'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',center:[-120.6,43.9],zoom:5.6,minZoom:4});
    map.addControl(new maplibregl.NavigationControl(),'bottom-right'); map.addControl(new maplibregl.ScaleControl({maxWidth:120,unit:'imperial'}),'bottom-left');
    const safe = v => String(v || '').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const link = (url,label) => url ? `<p><a href="${safe(url)}" target="_blank" rel="noopener">${label}</a></p>` : '';
    const popup = new maplibregl.Popup({closeButton:true,maxWidth:'335px'});
    function showPopup(feature){const p=feature.properties; popup.setLngLat(feature.geometry.coordinates).setHTML(`<h2>${safe(p.site_name)}</h2>${p.industry?`<p><b>Category:</b> ${safe(p.industry)}</p>`:''}${p.matrix_type?`<p><b>Sample matrix:</b> ${safe(p.matrix_type)}</p>`:''}${p.year?`<p><b>Year recorded:</b> ${safe(p.year)}</p>`:''}${p.pfas_level?`<p><b>PFAS level:</b> ${safe(p.pfas_level)} ppt</p>`:''}${p.pfoa?`<p><b>Maximum PFOA:</b> ${safe(p.pfoa)} ppt</p>`:''}${p.pfos?`<p><b>Maximum PFOS:</b> ${safe(p.pfos)} ppt</p>`:''}${link(p.site_ref_link,'Open site reference')}${link(p.pfas_testing_link,'Open PFAS testing data')}`).addTo(map);}
    async function loadSites(){const response=await fetch('./pfas-sites-oregon.geojson');if(!response.ok)throw new Error(`GeoJSON could not be loaded (${response.status}).`);const data=await response.json();document.getElementById('count').textContent=`${data.features.length} mapped locations`;document.getElementById('loading').style.display='none';map.addSource('sites',{type:'geojson',data,cluster:true,clusterMaxZoom:12,clusterRadius:42});map.addLayer({id:'clusters',type:'circle',source:'sites',filter:['has','point_count'],paint:{'circle-color':'#334155','circle-radius':['step',['get','point_count'],18,10,23,50,29],'circle-stroke-width':2,'circle-stroke-color':'#fff'}});map.addLayer({id:'cluster-count',type:'symbol',source:'sites',filter:['has','point_count'],layout:{'text-field':'{point_count_abbreviated}','text-font':['Open Sans Bold'],'text-size':12},paint:{'text-color':'#fff'}});map.addLayer({id:'site-points',type:'circle',source:'sites',filter:['!', ['has','point_count']],paint:{'circle-color':'#d44232','circle-radius':6,'circle-stroke-width':1.5,'circle-stroke-color':'#fff'}});map.on('click','clusters',async e=>{const f=map.queryRenderedFeatures(e.point,{layers:['clusters']})[0];map.easeTo({center:f.geometry.coordinates,zoom:await map.getSource('sites').getClusterExpansionZoom(f.properties.cluster_id)});});map.on('click','site-points',e=>showPopup(e.features[0]));['clusters','site-points'].forEach(layer=>map.on('mouseenter',layer,()=>map.getCanvas().style.cursor='pointer'));['clusters','site-points'].forEach(layer=>map.on('mouseleave',layer,()=>map.getCanvas().style.cursor=''));document.getElementById('search').addEventListener('change',e=>{const term=e.target.value.trim().toLowerCase();const match=data.features.find(f=>Object.values(f.properties).some(v=>String(v||'').toLowerCase().includes(term)));if(match){map.flyTo({center:match.geometry.coordinates,zoom:11,essential:true});showPopup(match);}});}
    map.on('load',()=>loadSites().catch(error=>{document.getElementById('loading').textContent=error.message;console.error(error);}));
  </script>
</body>
</html>
